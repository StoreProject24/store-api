version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - '3001:3000' # Ensure that this port mapping is correct
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379 # Use the service name here

    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
